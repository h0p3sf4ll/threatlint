# threatlint/azure-pipelines/secrets-scan.yml
# Reusable template: scan repository for hardcoded secrets and credentials.
#
# Usage:
#   - template: azure-pipelines/secrets-scan.yml@threatlint
#     parameters:
#       anthropicApiKey: $(ANTHROPIC_API_KEY)

parameters:
  - name: provider
    type: string
    default: claude
    values: [claude, openai, github-models]
  - name: anthropicApiKey
    type: string
    default: ''
  - name: openaiApiKey
    type: string
    default: ''
  - name: githubToken
    type: string
    default: $(System.AccessToken)
  - name: model
    type: string
    default: ''
  - name: gateSeverity
    type: string
    default: CRITICAL
  - name: minIssueSeverity
    type: string
    default: HIGH
  - name: createWorkItems
    type: boolean
    default: false

jobs:
  - job: AppsecSecretsScan
    displayName: AppSec Secrets Scan
    pool:
      vmImage: ubuntu-latest
    timeoutInMinutes: 20
    variables:
      REPORT_FILE: $(Agent.TempDirectory)/appsec-secrets-report.md
      PROVIDER: ${{ parameters.provider }}
      GATE_SEVERITY: ${{ parameters.gateSeverity }}

    steps:
      - checkout: self
        fetchDepth: 0

      - script: pip install anthropic
        displayName: Install Anthropic SDK
        condition: eq('${{ parameters.provider }}', 'claude')

      - script: |
          python3 - << 'PYEOF'
          import os, subprocess
          import anthropic

          files = subprocess.run(['git', 'ls-files'], capture_output=True, text=True).stdout[:3000]
          context = f"## Repository files\n```\n{files}\n```"
          for fname in ['README.md', 'package.json', 'requirements.txt', '.env.example',
                        '.env.sample', 'docker-compose.yml']:
              if os.path.isfile(fname):
                  with open(fname, errors='replace') as f:
                      context += f"\n\n## {fname}\n```\n{f.read(4000)}\n```"

          prompt = f"""## Repository Context\n{context}\n\n
          You are performing a secrets scan of this repository. Produce a two-tier Markdown
          secrets scan report: TIER 1 with Secrets Exposure Level (CRITICAL/HIGH/MEDIUM/LOW/CLEAN),
          Finding Summary table, Top Issues, Recommended Actions (rotation priority, gitignore,
          secret manager migration); TIER 2 with per-finding [SS-NNN] blocks (Secret Type,
          Location file:line, Exposure, Entropy, Active Risk, Impact, Mitigation with rotation
          steps), Secret Management Assessment table.
          Do not modify any repository source files."""

          client = anthropic.Anthropic(api_key=os.environ['ANTHROPIC_API_KEY'])
          message = client.messages.create(
              model='${{ parameters.model }}' or os.environ.get('APPSEC_MODEL', 'claude-sonnet-5'),
              max_tokens=8192,
              system='You are an expert application security engineer. Apply aggressive posture.',
              messages=[{'role': 'user', 'content': prompt}]
          )
          report = message.content[0].text
          with open(os.environ['REPORT_FILE'], 'w') as f:
              f.write(report)
          print(f"Report written ({len(report):,} chars)")
          PYEOF
        displayName: Run secrets scan (Claude)
        condition: eq('${{ parameters.provider }}', 'claude')
        env:
          ANTHROPIC_API_KEY: ${{ parameters.anthropicApiKey }}
          REPORT_FILE: $(REPORT_FILE)

      - script: pip install openai
        displayName: Install OpenAI SDK
        condition: in('${{ parameters.provider }}', 'openai', 'github-models')

      - script: |
          python3 .github/scripts/appsec_api.py \
            --mode secrets-scan \
            --provider "$PROVIDER" \
            --output "$(REPORT_FILE)" \
            --model "${{ parameters.model }}"
        displayName: Run secrets scan (OpenAI / GitHub Models)
        condition: in('${{ parameters.provider }}', 'openai', 'github-models')
        env:
          OPENAI_API_KEY: ${{ parameters.openaiApiKey }}
          GH_TOKEN: ${{ parameters.githubToken }}
          PROVIDER: ${{ parameters.provider }}

      - publish: $(REPORT_FILE)
        artifact: appsec-secrets-report-$(Build.BuildId)
        displayName: Publish secrets scan report
        condition: always()

      - script: |
          if [ -f "$(REPORT_FILE)" ]; then
            python3 .github/scripts/to_sarif.py \
              --report "$(REPORT_FILE)" \
              --output "$(Agent.TempDirectory)/appsec-secrets.sarif" \
              --tool "appsec-secrets-scanner" \
              --commit-sha "$(Build.SourceVersion)"
          fi
        displayName: Convert report to SARIF
        condition: always()

      - task: PublishBuildArtifacts@1
        displayName: Publish SARIF artifact
        condition: always()
        inputs:
          pathToPublish: $(Agent.TempDirectory)/appsec-secrets.sarif
          artifactName: CodeAnalysisLogs

      - script: |
          if [ ! -f "$(REPORT_FILE)" ]; then echo "No report — skipping gate."; exit 0; fi
          python3 .github/scripts/gate_report.py \
            --report "$(REPORT_FILE)" --severity "$(GATE_SEVERITY)"
        displayName: Gate on severity threshold
        condition: and(always(), ne(variables['GATE_SEVERITY'], ''))

      - script: |
          if [ ! -f "$(REPORT_FILE)" ]; then exit 0; fi
          python3 .github/scripts/create_ado_workitems.py \
            --report "$(REPORT_FILE)" \
            --min-severity "${{ parameters.minIssueSeverity }}" \
            --org "$(System.TeamFoundationCollectionUri)" \
            --project "$(System.TeamProject)" \
            --token "$(System.AccessToken)" || true
        displayName: Create ADO work items for findings
        condition: and(always(), eq('${{ parameters.createWorkItems }}', 'true'))
