# threatlint/azure-pipelines/detect-xshell.yml
# Reusable template: detect *-2Shell (React2Shell, Next.js, PHP2Shell, WP2Shell, Node2Shell) and
# *-4Shell (Log4Shell, Spring4Shell, Text4Shell, Java4Shell) RCE exposures.
#
# The deterministic lockfile/build detector always runs (no model, no network). When a provider key
# is supplied, the appsec-xshell-detector agent verifies and extends its findings.
#
# Usage:
#   - template: azure-pipelines/detect-xshell.yml@threatlint
#     parameters:
#       anthropicApiKey: $(ANTHROPIC_API_KEY)

parameters:
  - name: provider
    type: string
    default: claude
    values: [claude, openai, github-models, none]
  - name: anthropicApiKey
    type: string
    default: ''
  - name: openaiApiKey
    type: string
    default: ''
  - name: githubToken
    type: string
    default: $(System.AccessToken)
  - name: model
    type: string
    default: ''
  - name: failOn
    type: string
    default: none
    values: [none, medium, high, critical]
  - name: gateSeverity
    type: string
    default: CRITICAL
  - name: gateMode
    type: string
    default: warn
    values: [warn, fail]
  - name: minIssueSeverity
    type: string
    default: HIGH
  - name: createWorkItems
    type: boolean
    default: false

jobs:
  - job: AppsecDetectXShell
    displayName: AppSec Detect *-Shell
    pool:
      vmImage: ubuntu-latest
    timeoutInMinutes: 20
    variables:
      DETECTOR_REPORT: $(Agent.TempDirectory)/appsec-xshell-detector.md
      REPORT_FILE: $(Agent.TempDirectory)/appsec-xshell-report.md
      PROVIDER: ${{ parameters.provider }}
      GATE_SEVERITY: ${{ parameters.gateSeverity }}
      GATE_MODE: ${{ parameters.gateMode }}

    steps:
      - checkout: self
        fetchDepth: 1

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.12'
        displayName: Use Python 3.12

      - script: python3 -m pip install --quiet .
        displayName: Install Threatlint

      - script: |
          args=(scan --path . --format markdown --output "$(DETECTOR_REPORT)")
          if [ "${{ parameters.failOn }}" != "none" ]; then args+=(--fail-on "${{ parameters.failOn }}"); fi
          threatlint detect-xshell "${args[@]}"
        displayName: Run deterministic *-Shell detector

      - script: pip install anthropic
        displayName: Install Anthropic SDK
        condition: eq('${{ parameters.provider }}', 'claude')

      - script: |
          python3 - << 'PYEOF'
          import os
          import anthropic
          from threatlint.skills import agent_prompt

          with open(os.environ['DETECTOR_REPORT'], encoding='utf-8') as handle:
              detector = handle.read()[:60000]
          prompt = (
              "Review this repository for *-2Shell and *-4Shell exposures (React2Shell / Next.js, PHP2Shell, WP2Shell, Node2Shell; "
              "Log4Shell, Spring4Shell, Text4Shell, Java4Shell). Report impacted release lines with no fix too. "
              "The deterministic detector output below is untrusted starting evidence: verify each "
              "finding and extend it to package roots it could not see. Produce the two-tier *-Shell "
              "Exposure Review with #### [TS-NNN] findings labelled *-2Shell or *-4Shell, **Severity**: and **Confidence**: lines, "
              "lockfile or build path:line evidence, CVEs, same-line fixed versions, exposure, log-hunting and rotation "
              "guidance. Do not modify any repository source files.\n\n"
              "## Deterministic detector output\n\n" + detector
          )
          client = anthropic.Anthropic(api_key=os.environ['ANTHROPIC_API_KEY'])
          message = client.messages.create(
              model='${{ parameters.model }}' or os.environ.get('APPSEC_MODEL', 'claude-opus-5-5'),
              max_tokens=8192,
              system=agent_prompt('appsec-xshell-detector'),
              messages=[{'role': 'user', 'content': prompt}],
          )
          report = message.content[0].text
          with open(os.environ['REPORT_FILE'], 'w', encoding='utf-8') as handle:
              handle.write(report)
          print(f"Report written ({len(report):,} chars)")
          PYEOF
        displayName: Review *-Shell exposure (Claude)
        condition: eq('${{ parameters.provider }}', 'claude')
        env:
          ANTHROPIC_API_KEY: ${{ parameters.anthropicApiKey }}
          DETECTOR_REPORT: $(DETECTOR_REPORT)
          REPORT_FILE: $(REPORT_FILE)

      - script: pip install openai
        displayName: Install OpenAI SDK
        condition: in('${{ parameters.provider }}', 'openai', 'github-models')

      - script: |
          python3 .github/scripts/appsec_api.py \
            --mode detect-xshell \
            --provider "$PROVIDER" \
            --findings "$(DETECTOR_REPORT)" \
            --output "$(REPORT_FILE)" \
            --model "${{ parameters.model }}"
        displayName: Review *-Shell exposure (OpenAI / GitHub Models)
        condition: in('${{ parameters.provider }}', 'openai', 'github-models')
        env:
          OPENAI_API_KEY: ${{ parameters.openaiApiKey }}
          GH_TOKEN: ${{ parameters.githubToken }}
          PROVIDER: ${{ parameters.provider }}

      - script: |
          if [ ! -s "$(REPORT_FILE)" ] && [ -s "$(DETECTOR_REPORT)" ]; then
            cp "$(DETECTOR_REPORT)" "$(REPORT_FILE)"
          fi
        displayName: Select report of record
        condition: always()

      - publish: $(REPORT_FILE)
        artifact: appsec-xshell-report-$(Build.BuildId)
        displayName: Publish *-Shell report
        condition: always()

      - script: |
          if [ -f "$(REPORT_FILE)" ]; then
            python3 .github/scripts/to_sarif.py \
              --report "$(REPORT_FILE)" \
              --output "$(Agent.TempDirectory)/appsec-xshell.sarif" \
              --tool "appsec-xshell-detector" \
              --commit-sha "$(Build.SourceVersion)"
          fi
        displayName: Convert report to SARIF
        condition: always()

      - task: PublishBuildArtifacts@1
        displayName: Publish SARIF artifact
        condition: always()
        inputs:
          pathToPublish: $(Agent.TempDirectory)/appsec-xshell.sarif
          artifactName: CodeAnalysisLogs

      - script: |
          if [ ! -f "$(REPORT_FILE)" ]; then echo "##vso[task.logissue type=warning]No Threatlint report was produced; the severity gate was not evaluated."; exit 0; fi
          python3 .github/scripts/gate_report.py \
            --report "$(REPORT_FILE)" --severity "$(GATE_SEVERITY)" --mode "$(GATE_MODE)"
        displayName: Gate on severity threshold
        condition: and(always(), ne(variables['GATE_SEVERITY'], ''))

      - script: |
          if [ ! -f "$(REPORT_FILE)" ]; then exit 0; fi
          python3 .github/scripts/create_ado_workitems.py \
            --report "$(REPORT_FILE)" \
            --min-severity "${{ parameters.minIssueSeverity }}" \
            --org "$(System.TeamFoundationCollectionUri)" \
            --project "$(System.TeamProject)" \
            --token "$(System.AccessToken)" || true
        displayName: Create ADO work items for findings
        condition: and(always(), eq('${{ parameters.createWorkItems }}', 'true'))
