name: Apply security fix and rescan

# Maintainer-initiated only. Untrusted issue/PR comment text is never a command.
on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch containing the reviewed finding
        required: true
        default: main
      expected_sha:
        description: Full exact commit SHA from the Security scanner artifact
        required: true
      finding_id:
        description: Exact eligible finding ID from the Security scanner artifact
        required: true
      apply_reviewed_fix:
        description: I reviewed this deterministic edit; apply, rescan, and open a draft PR
        type: boolean
        default: false
        required: true
      auto_apply_debug_policy:
        description: Explicitly opt in to the sole DEBUG=True to False policy without per-edit approval; draft PR still requires human review
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: security-fix-${{ github.event.inputs.base_branch }}
  cancel-in-progress: false

jobs:
  reviewed-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: security-fixes
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted tool from the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: scanner-tool
          persist-credentials: false
      - name: Require a deployed trusted remediation implementation
        env:
          TRUSTED_FIXER: ${{ github.workspace }}/scanner-tool/.github/scripts/security_scanner_fix.py
        run: |
          if [ ! -f "$TRUSTED_FIXER" ]; then
            echo "::error::Fix was not evaluated: deploy the reviewed scanner implementation to the trusted default branch first."
            exit 1
          fi
      - name: Check out selected branch as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_branch }}
          path: scanner-target
          persist-credentials: false
      - name: Validate the revision, prepare the edit, and optionally apply
        env:
          PYTHONPATH: ${{ github.workspace }}/scanner-tool/src
          SCAN_TOOL: ${{ github.workspace }}/scanner-tool/.github/scripts/security_scanner_fix.py
          SCAN_TARGET: ${{ github.workspace }}/scanner-target
          SCAN_OUTPUT: ${{ runner.temp }}/security-fix-evidence
          SCAN_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FINDING_ID: ${{ inputs.finding_id }}
          APPLY_REVIEWED: ${{ inputs.apply_reviewed_fix }}
          AUTO_DEBUG_POLICY: ${{ inputs.auto_apply_debug_policy }}
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          args=(--repo "$SCAN_TARGET" --repository "$SCAN_REPOSITORY" --base-branch "$BASE_BRANCH" --expected-sha "$EXPECTED_SHA" --finding-id "$FINDING_ID" --output-dir "$SCAN_OUTPUT")
          if [ "$APPLY_REVIEWED" = "true" ]; then args+=(--apply); fi
          if [ "$AUTO_DEBUG_POLICY" = "true" ]; then args+=(--auto-apply-debug); fi
          python3 "$SCAN_TOOL" "${args[@]}"
      - name: Save review and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/security-fix-evidence
          if-no-files-found: ignore
          retention-days: 14
