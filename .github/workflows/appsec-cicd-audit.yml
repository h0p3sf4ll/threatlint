name: AppSec CI/CD Audit

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.gitlab-ci.yml'
      - 'Jenkinsfile'
      - '.circleci/**'
      - 'azure-pipelines/**'
      - 'azure-pipelines.yml'
      - '.buildkite/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write
  id-token: write

concurrency:
  group: appsec-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Model review configuration
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.configuration.outputs.enabled }}
    steps:
      - name: Check out review configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check model review setup
        id: configuration
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPSEC_ENABLED: ${{ vars.APPSEC_REVIEWS_ENABLED }}
          APPSEC_PROVIDER: ${{ vars.APPSEC_PROVIDER }}
          APPSEC_GATE_MODE: ${{ vars.APPSEC_GATE_MODE }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: python3 .github/scripts/appsec_configuration.py

  cicd-audit:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVIDER: ${{ vars.APPSEC_PROVIDER || 'claude' }}
      MIN_ISSUE_SEVERITY: ${{ vars.APPSEC_MIN_ISSUE_SEVERITY || 'HIGH' }}
      GATE_SEVERITY: ${{ vars.APPSEC_GATE_SEVERITY || 'CRITICAL' }}
      # warn (default): findings are annotated and the job stays green. fail: the job fails.
      GATE_MODE: ${{ vars.APPSEC_GATE_MODE || 'warn' }}
      REPORT_FILE: /tmp/appsec-cicd-report.md

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ─── Claude ───────────────────────────────────────────────────────────
      - name: Validate Claude credentials
        if: env.PROVIDER == 'claude'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Configure ANTHROPIC_API_KEY in Settings > Secrets and variables > Actions before running the Claude provider."
            exit 1
          fi

      - name: Run CI/CD audit (Claude)
        if: env.PROVIDER == 'claude'
        uses: anthropics/claude-code-action/base-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the project appsec-cicd-auditor to audit all CI/CD pipeline configuration
            in this repository for security weaknesses.

            Produce a two-tier Markdown CI/CD security audit:
            TIER 1: Pipeline Security Level, Finding Summary, Top Issues.
            TIER 2: Secret Exposure Map table, per-finding blocks ([CI-NNN] — Title, Workflow,
            Job/Step, Injection Vector with exact untrusted context value, Evidence, Attack Scenario,
            Impact, Mitigation with corrected YAML snippet), Action Provenance Audit table.

            After writing the report, save it:
            tee /tmp/appsec-cicd-report.md << 'APPSEC_END_OF_REPORT'
            [paste complete report, then close with APPSEC_END_OF_REPORT]
            APPSEC_END_OF_REPORT

            Do not modify any repository source files.
          claude_args: |
            --model ${{ vars.THREATLINT_SCAN_MODEL || 'claude-opus-5-5' }}
            --agent appsec-cicd-auditor
            --max-turns 16
            --allowedTools "Read,Grep,Glob,Bash"

      # ─── OpenAI / GitHub Models ───────────────────────────────────────────
      - name: Set up Python
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install openai SDK
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        run: pip install openai

      - name: Run CI/CD audit (OpenAI / GitHub Models)
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/appsec_api.py \
            --mode cicd-audit \
            --provider "$PROVIDER" \
            --output "$REPORT_FILE"

      # ─── Upload artifact ──────────────────────────────────────────────────
      - name: Upload CI/CD audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appsec-cicd-report-${{ github.run_id }}
          path: ${{ env.REPORT_FILE }}
          retention-days: 30
          if-no-files-found: warn

      # ─── SARIF upload to GitHub Code Scanning ────────────────────────────
      - name: Convert report to SARIF
        if: always()
        run: |
          if [ -f "$REPORT_FILE" ]; then
            python3 .github/scripts/to_sarif.py \
              --report "$REPORT_FILE" \
              --output /tmp/appsec-cicd.sarif \
              --tool "appsec-cicd-auditor" \
              --commit-sha "${{ github.sha }}"
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: /tmp/appsec-cicd.sarif
        continue-on-error: true

      # ─── Gate: warn (default) or fail on findings at or above threshold ─────
      - name: Gate on severity threshold
        if: always() && env.GATE_SEVERITY != ''
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "::warning::No Threatlint report was produced; the severity gate was not evaluated."
            exit 0
          fi
          python3 .github/scripts/gate_report.py \
            --report "$REPORT_FILE" \
            --severity "$GATE_SEVERITY" \
            --mode "$GATE_MODE"

      # ─── Create GitHub issues ─────────────────────────────────────────────
      - name: Create GitHub issues for findings
        if: always()
        env:
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file — skipping issue creation."
            exit 0
          fi
          python3 .github/scripts/create_issues.py \
            --report "$REPORT_FILE" \
            --run-url "$REVIEW_RUN_URL" \
            --min-severity "$MIN_ISSUE_SEVERITY"
