name: AppSec Secrets Scan

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.env'
      - '**/*.env.*'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.go'
      - '**/*.rb'
      - '**/*.java'
      - '**/*.config'
      - '**/*.conf'
      - '**/*.ini'
      - '**/*.toml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write
  id-token: write

concurrency:
  group: appsec-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVIDER: ${{ vars.APPSEC_PROVIDER || 'claude' }}
      MIN_ISSUE_SEVERITY: ${{ vars.APPSEC_MIN_ISSUE_SEVERITY || 'HIGH' }}
      GATE_SEVERITY: ${{ vars.APPSEC_GATE_SEVERITY || 'CRITICAL' }}
      REPORT_FILE: /tmp/appsec-secrets-report.md

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # full history for git log secret hunting

      # ─── Claude ───────────────────────────────────────────────────────────
      - name: Run secrets scan (Claude)
        if: env.PROVIDER == 'claude'
        uses: anthropics/claude-code-action@9c41ed18ca8b2b2a17eaef4723d5092ccdebc814 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the project appsec-secrets-scanner to scan the entire repository for
            hardcoded secrets, credentials, tokens, and high-entropy strings.

            Produce a two-tier Markdown secrets scan report:
            TIER 1: Secrets Exposure Level, Finding Summary table, Top Issues, Recommended Actions.
            TIER 2: Per-finding blocks ([SS-NNN] — Title, Secret Type, Location file:line,
            Exposure, Entropy, Active Risk, Impact, Mitigation including rotation steps),
            Secret Management Assessment table.

            After writing the report, save it:
            tee /tmp/appsec-secrets-report.md << 'APPSEC_END_OF_REPORT'
            [paste complete report, then close with APPSEC_END_OF_REPORT]
            APPSEC_END_OF_REPORT

            Do not modify any repository source files.
          claude_args: |
            --agent appsec-secrets-scanner
            --max-turns 16
            --allowedTools "Read,Grep,Glob,Bash"

      # ─── OpenAI / GitHub Models ───────────────────────────────────────────
      - name: Set up Python
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install openai SDK
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        run: pip install openai

      - name: Run secrets scan (OpenAI / GitHub Models)
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/appsec_api.py \
            --mode secrets-scan \
            --provider "$PROVIDER" \
            --output "$REPORT_FILE"

      # ─── Upload artifact ──────────────────────────────────────────────────
      - name: Upload secrets scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appsec-secrets-report-${{ github.run_id }}
          path: ${{ env.REPORT_FILE }}
          retention-days: 30
          if-no-files-found: warn

      # ─── SARIF upload to GitHub Code Scanning ────────────────────────────
      - name: Convert report to SARIF
        if: always()
        run: |
          if [ -f "$REPORT_FILE" ]; then
            python3 .github/scripts/to_sarif.py \
              --report "$REPORT_FILE" \
              --output /tmp/appsec-secrets.sarif \
              --tool "appsec-secrets-scanner" \
              --commit-sha "${{ github.sha }}"
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/appsec-secrets.sarif
        continue-on-error: true

      # ─── Gate: fail if findings at or above threshold ─────────────────────
      - name: Gate on severity threshold
        if: always() && env.GATE_SEVERITY != ''
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file — skipping gate."
            exit 0
          fi
          python3 .github/scripts/gate_report.py \
            --report "$REPORT_FILE" \
            --severity "$GATE_SEVERITY"

      # ─── Create GitHub issues ─────────────────────────────────────────────
      - name: Create GitHub issues for findings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file — skipping issue creation."
            exit 0
          fi
          python3 .github/scripts/create_issues.py \
            --report "$REPORT_FILE" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --min-severity "$MIN_ISSUE_SEVERITY"
