name: Organization reference check
# Blocks organization-identifying text in code, diffs and commit messages (terms in .org-blocklist).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          fetch-depth: 0
      - name: Tracked files
        run: scripts/check-org-references.sh tree
      - name: New commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
            scripts/check-org-references.sh range "$BASE..$HEAD_SHA"
          else
            scripts/check-org-references.sh range "$HEAD_SHA"
          fi
