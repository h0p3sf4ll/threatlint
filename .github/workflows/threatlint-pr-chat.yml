# threatlint/.github/workflows/threatlint-pr-chat.yml
# Converse with Threatlint on pull requests: comment `/threatlint <question>` (or mention
# `@threatlint`) on a PR or on a review comment, and Threatlint replies in the same conversation
# using the configured model, the PR diff, and the latest Threatlint report on the PR.
#
# Security model:
#   * Only OWNER / MEMBER / COLLABORATOR comments trigger it; bots and Threatlint's own replies
#     (hidden <!-- threatlint:chat --> marker) are ignored, so it never loops.
#   * PR code is never checked out or executed. The default branch of the base repository is
#     checked out only to load the chat script; the diff is fetched read-only via the API.
#   * Comment text, PR description, diff, and report reach the script through the event payload
#     file and env, never through ${{ }} expressions inside run blocks.
#
# Callable directly (copy this file) or as a reusable workflow:
#   jobs:
#     chat:
#       uses: InfoSec-Actions/threatlint/.github/workflows/threatlint-pr-chat.yml@<full-commit-sha>
#       with: { provider: claude, threatlint-ref: <same sha> }
#       secrets: { ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} }
# See docs/ci-templates.md → "Conversing with Threatlint on pull requests".

name: Threatlint PR chat

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_call:
    inputs:
      provider:
        description: claude | openai | github-models
        type: string
        default: claude
      model:
        description: Model override. Empty uses the provider default.
        type: string
        default: ''
      threatlint-repository:
        description: Repository that hosts the Threatlint chat script.
        type: string
        default: InfoSec-Actions/threatlint
      threatlint-ref:
        description: Ref of threatlint-repository. Pin to the same commit SHA as the uses line.
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: threatlint-pr-chat-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reply:
    name: Reply to /threatlint
    # Cheap pre-filter; threatlint_chat.py re-checks every condition before calling a model.
    if: >-
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      (startsWith(github.event.comment.body, '/threatlint') || contains(github.event.comment.body, '@threatlint')) &&
      !contains(github.event.comment.body, '<!-- threatlint:chat -->') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check out Threatlint (never the pull request head)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.threatlint-repository || github.repository }}
          ref: ${{ inputs.threatlint-ref || github.event.repository.default_branch }}
          path: .threatlint
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Answer the question
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TL_PROVIDER: ${{ inputs.provider || vars.THREATLINT_CHAT_PROVIDER || 'claude' }}
          TL_MODEL: ${{ inputs.model || vars.THREATLINT_CHAT_MODEL || '' }}
        run: python3 .threatlint/.github/scripts/threatlint_chat.py --platform github
