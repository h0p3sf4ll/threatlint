name: AppSec PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write
  id-token: write

concurrency:
  group: appsec-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Do not expose credentials to untrusted fork pull requests.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Set the APPSEC_PROVIDER repository variable to 'openai' or 'github-models' to switch
      # providers without editing this file. Defaults to 'claude'.
      PROVIDER: ${{ vars.APPSEC_PROVIDER || 'claude' }}
      # Minimum finding severity to open a GitHub issue for. Override with APPSEC_MIN_ISSUE_SEVERITY.
      MIN_ISSUE_SEVERITY: ${{ vars.APPSEC_MIN_ISSUE_SEVERITY || 'HIGH' }}
      # Gate severity: fail the workflow if any finding at or above this level is found.
      # Set APPSEC_GATE_SEVERITY='' to disable gating. Default: CRITICAL (blocks only critical findings).
      GATE_SEVERITY: ${{ vars.APPSEC_GATE_SEVERITY || 'CRITICAL' }}
      REPORT_FILE: /tmp/appsec-report.md

    steps:
      - name: Check out pull request history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # ─── Claude ───────────────────────────────────────────────────────────
      - name: Run AppSec code review (Claude)
        if: env.PROVIDER == 'claude'
        uses: anthropics/claude-code-action@9c41ed18ca8b2b2a17eaef4723d5092ccdebc814 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the project appsec-code-reviewer to review this pull request.
            Analyze the diff from base commit ${{ github.event.pull_request.base.sha }}
            to head commit ${{ github.event.pull_request.head.sha }}.

            Produce a two-tier Markdown report:

            TIER 1 — EXECUTIVE SUMMARY: Change Risk Level (CRITICAL/HIGH/MEDIUM/LOW/CLEAN),
            one-sentence risk statement, finding summary table with CONFIRMED/PLAUSIBLE/THEORETICAL
            counts per severity, Top Issues (Critical and High only), and a Merge Recommendation
            (BLOCK / MERGE WITH ACTION / MERGE).

            TIER 2 — TECHNICAL REVIEW: review scope, per-finding blocks (#### [CR-NNN] — Title,
            Severity, Confidence, OWASP/CWE, evidence-quoted changed lines, exploit path, impact,
            likelihood, Remediation Guidance with numbered steps and before/after code snippets,
            Test Case). End with Security-Positive Changes and Residual Risk sections.

            Only report security regressions and missing controls. Exclude style, performance,
            and maintainability feedback.

            After writing the complete report in your response, save it to disk by running:

            tee /tmp/appsec-report.md << 'APPSEC_END_OF_REPORT'
            [paste the complete Markdown report here, then close with APPSEC_END_OF_REPORT on its own line]
            APPSEC_END_OF_REPORT

            Do not modify any repository source files.
          claude_args: |
            --agent appsec-code-reviewer
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash"

      # ─── OpenAI / GitHub Models ───────────────────────────────────────────
      - name: Set up Python
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install openai SDK
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        run: pip install openai

      - name: Run AppSec code review (OpenAI / GitHub Models)
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/appsec_api.py \
            --mode pr-review \
            --provider "$PROVIDER" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --output "$REPORT_FILE"

      # ─── Upload report artifact ───────────────────────────────────────────
      - name: Upload PR security review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appsec-pr-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ env.REPORT_FILE }}
          retention-days: 30
          if-no-files-found: warn

      # ─── Post PR comment with summary ────────────────────────────────────
      - name: Post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file — skipping PR comment."
          else
            python3 .github/scripts/post_pr_comment.py \
              --report "$REPORT_FILE" \
              --pr "${{ github.event.pull_request.number }}" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      # ─── SARIF upload to GitHub Code Scanning ────────────────────────────
      - name: Convert report to SARIF
        if: always()
        run: |
          if [ -f "$REPORT_FILE" ]; then
            python3 .github/scripts/to_sarif.py \
              --report "$REPORT_FILE" \
              --output /tmp/appsec-results.sarif \
              --tool "appsec-code-reviewer" \
              --commit-sha "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/appsec-results.sarif
        continue-on-error: true

      # ─── Gate: fail if findings at or above threshold ─────────────────────
      - name: Gate on severity threshold
        if: always() && env.GATE_SEVERITY != ''
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file — skipping gate."
            exit 0
          fi
          python3 .github/scripts/gate_report.py \
            --report "$REPORT_FILE" \
            --severity "$GATE_SEVERITY"

      # ─── Create GitHub issues for findings ────────────────────────────────
      - name: Create GitHub issues for findings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file found at $REPORT_FILE — skipping issue creation."
            exit 0
          fi
          python3 .github/scripts/create_issues.py \
            --report "$REPORT_FILE" \
            --pr "${{ github.event.pull_request.number }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --min-severity "$MIN_ISSUE_SEVERITY"
