name: AppSec IaC Review

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'terraform/**'
      - 'infra/**'
      - 'k8s/**'
      - 'helm/**'
      - 'deploy/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'docker-compose*.yaml'
      - '**cloudformation**.yml'
      - '**cloudformation**.yaml'
      - '**cloudformation**.json'
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'terraform/**'
      - 'infra/**'
      - 'k8s/**'
      - 'helm/**'
      - 'deploy/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'docker-compose*.yaml'
  workflow_dispatch:
    inputs:
      target:
        description: Specific IaC path or tool to focus on (blank for all)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  security-events: write
  id-token: write

concurrency:
  group: appsec-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVIDER: ${{ vars.APPSEC_PROVIDER || 'claude' }}
      MIN_ISSUE_SEVERITY: ${{ vars.APPSEC_MIN_ISSUE_SEVERITY || 'HIGH' }}
      REPORT_FILE: /tmp/appsec-iac-report.md

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ─── Claude ───────────────────────────────────────────────────────────
      - name: Run IaC security review (Claude)
        if: env.PROVIDER == 'claude'
        uses: anthropics/claude-code-action@9c41ed18ca8b2b2a17eaef4723d5092ccdebc814 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the project appsec-iac-reviewer to review all Infrastructure as Code
            in this repository. Target: ${{ inputs.target || 'all IaC files' }}

            Produce a two-tier Markdown IaC security review:
            TIER 1: Infrastructure Risk Level, Finding Summary table, Top Issues.
            TIER 2: IaC Inventory table, per-finding blocks ([IC-NNN] — Title, Resource,
            File location, Misconfiguration, Evidence, Blast Radius, Mitigation, Validation),
            Prioritized Remediation Roadmap.

            After writing the report, save it:
            tee /tmp/appsec-iac-report.md << 'APPSEC_END_OF_REPORT'
            [paste complete report, then close with APPSEC_END_OF_REPORT]
            APPSEC_END_OF_REPORT

            Do not modify any repository source files.
          claude_args: |
            --agent appsec-iac-reviewer
            --max-turns 16
            --allowedTools "Read,Grep,Glob,Bash"

      # ─── OpenAI / GitHub Models ───────────────────────────────────────────
      - name: Set up Python
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install openai SDK
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        run: pip install openai

      - name: Run IaC security review (OpenAI / GitHub Models)
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/appsec_api.py \
            --mode iac-review \
            --provider "$PROVIDER" \
            --target "${{ inputs.target }}" \
            --output "$REPORT_FILE"

      # ─── Upload artifact ──────────────────────────────────────────────────
      - name: Upload IaC review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appsec-iac-report-${{ github.run_id }}
          path: ${{ env.REPORT_FILE }}
          retention-days: 30
          if-no-files-found: warn

      # ─── SARIF upload to GitHub Code Scanning ────────────────────────────
      - name: Convert report to SARIF
        if: always()
        run: |
          if [ -f "$REPORT_FILE" ]; then
            python3 .github/scripts/to_sarif.py \
              --report "$REPORT_FILE" \
              --output /tmp/appsec-iac.sarif \
              --tool "appsec-iac-reviewer" \
              --commit-sha "${{ github.sha }}"
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/appsec-iac.sarif
        continue-on-error: true

      # ─── Create GitHub issues ─────────────────────────────────────────────
      - name: Create GitHub issues for findings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file — skipping issue creation."
            exit 0
          fi
          python3 .github/scripts/create_issues.py \
            --report "$REPORT_FILE" \
            --pr "${{ github.event.pull_request.number }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --min-severity "$MIN_ISSUE_SEVERITY"
