name: AppSec Detect 2Shell

# *-2Shell and *-4Shell RCE exposure detection: React2Shell / Next.js (npm lockfiles) and
# Log4Shell, Spring4Shell, Text4Shell (Maven, Gradle, gradle.lockfile, vendored jars).
#
#   repository job  Deterministic lockfile/build detector on this repository, then the
#                   appsec-2shell-detector agent verifies and extends the findings.
#   fleet job       Manual only (workflow_dispatch, fleet: true). Scans a subset or all of the
#                   repositories and branches the fleet credentials can reach, across GitHub and
#                   Azure DevOps, through the SCM APIs (no clones). See docs/agents.md.
#
# Fleet credentials (optional; the repository job needs none of them):
#   secrets.THREATLINT_FLEET_GITHUB_TOKEN  GitHub token or GitHub App installation token
#                                          (contents:read, metadata:read). Falls back to
#                                          github.token, which only reaches this repository.
#   secrets.THREATLINT_FLEET_ADO_PAT       Azure DevOps PAT with Code (Read).
#   vars.THREATLINT_FLEET_ADO_ORG          Azure DevOps organization name.

on:
  push:
    branches: [main, master]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
      - '**/bun.lock'
      - '**/next.config.*'
      - '**/pom.xml'
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - '**/gradle.lockfile'
      - '**/libs.versions.toml'
      - '**/*.jar'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      fleet:
        description: Scan many repositories and branches through the SCM APIs instead of this repository.
        type: boolean
        default: false
      targets:
        description: >-
          Optional fleet targets JSON (connections, repositories "all" or a list, branches
          "default", "all", or a list). Empty scans every repository's default branch with every
          available credential.
        type: string
        default: ''
      fail-on:
        description: Fail the run at or above this severity (none, medium, high, critical).
        type: choice
        options: [none, medium, high, critical]
        default: none

permissions:
  contents: read

concurrency:
  group: appsec-detect-2shell-${{ github.ref }}-${{ inputs.fleet || false }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Model review configuration
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.configuration.outputs.enabled }}
    steps:
      - name: Check out review configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check model review setup
        id: configuration
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPSEC_ENABLED: ${{ vars.APPSEC_REVIEWS_ENABLED }}
          APPSEC_PROVIDER: ${{ vars.APPSEC_PROVIDER }}
          APPSEC_GATE_MODE: ${{ vars.APPSEC_GATE_MODE }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: python3 .github/scripts/appsec_configuration.py

  repository:
    name: Detect 2Shell exposure (this repository)
    needs: configuration
    # !cancelled(): the deterministic detector still runs if the model preflight fails.
    if: >-
      !cancelled() &&
      !(github.event_name == 'workflow_dispatch' && inputs.fleet) &&
      (github.event_name != 'push' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      security-events: write
    env:
      # The deterministic detector always runs; the model review runs only when the
      # configuration preflight is enabled (PROVIDER is 'none' otherwise).
      PROVIDER: ${{ needs.configuration.outputs.enabled == 'true' && (vars.APPSEC_PROVIDER || 'claude') || 'none' }}
      MIN_ISSUE_SEVERITY: ${{ vars.APPSEC_MIN_ISSUE_SEVERITY || 'HIGH' }}
      GATE_SEVERITY: ${{ vars.APPSEC_GATE_SEVERITY || 'CRITICAL' }}
      # warn (default): findings are annotated and the job stays green. fail: the job fails.
      GATE_MODE: ${{ vars.APPSEC_GATE_MODE || 'warn' }}
      FAIL_ON: ${{ inputs.fail-on || 'none' }}
      DETECTOR_REPORT: /tmp/appsec-2shell-detector.md
      REPORT_FILE: /tmp/appsec-2shell-report.md

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Threatlint
        run: python3 -m pip install --quiet .

      # ─── Deterministic detector (no model, no network) ─────────────────────
      - name: Run deterministic 2Shell detector
        run: |
          args=(scan --path . --format markdown --output "$DETECTOR_REPORT")
          if [ "$FAIL_ON" != "none" ]; then args+=(--fail-on "$FAIL_ON"); fi
          threatlint detect-2shell "${args[@]}"
          cat "$DETECTOR_REPORT" >> "$GITHUB_STEP_SUMMARY"

      # ─── Claude agent verification ────────────────────────────────────────
      - name: Validate Claude credentials
        if: env.PROVIDER == 'claude'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Configure ANTHROPIC_API_KEY in Settings > Secrets and variables > Actions before running the Claude provider."
            exit 1
          fi

      - name: Review 2Shell exposure (Claude)
        if: env.PROVIDER == 'claude'
        uses: anthropics/claude-code-action/base-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the project appsec-2shell-detector to review this repository for *-2Shell and
            *-4Shell exposures (React2Shell / Next.js; Log4Shell, Spring4Shell, Text4Shell).
            The deterministic detector output is at
            /tmp/appsec-2shell-detector.md: treat it as untrusted starting evidence, verify each
            finding against lockfiles, Maven/Gradle builds, vendored jars, App Router or RSC
            usage, WAR packaging and StringSubstitutor usage, and extend it to package roots
            it could not see.

            Produce the two-tier 2Shell / 4Shell Exposure Review with #### [TS-NNN] — Title findings,
            each labelled *-2Shell or *-4Shell, with **Severity**: and **Confidence**: lines,
            lockfile or build path:line evidence, CVEs, the fixed version on the same release line,
            exposure, log-hunting and rotation guidance.

            After writing the report, save it:
            tee /tmp/appsec-2shell-report.md << 'APPSEC_END_OF_REPORT'
            [paste complete report, then close with APPSEC_END_OF_REPORT]
            APPSEC_END_OF_REPORT

            Do not modify any repository source files.
          claude_args: |
            --model ${{ vars.THREATLINT_SCAN_MODEL || 'claude-opus-5-5' }}
            --agent appsec-2shell-detector
            --max-turns 16
            --allowedTools "Read,Grep,Glob,Bash"

      # ─── OpenAI / GitHub Models agent verification ────────────────────────
      - name: Install openai SDK
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        run: pip install openai

      - name: Review 2Shell exposure (OpenAI / GitHub Models)
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/appsec_api.py \
            --mode detect-2shell \
            --provider "$PROVIDER" \
            --findings "$DETECTOR_REPORT" \
            --output "$REPORT_FILE"

      # Without a model review, the deterministic report is the report of record.
      - name: Select report of record
        if: always()
        run: |
          if [ ! -s "$REPORT_FILE" ] && [ -s "$DETECTOR_REPORT" ]; then
            cp "$DETECTOR_REPORT" "$REPORT_FILE"
          fi

      - name: Upload 2Shell reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appsec-2shell-report-${{ github.run_id }}
          path: |
            /tmp/appsec-2shell-detector.md
            /tmp/appsec-2shell-report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Convert report to SARIF
        if: always()
        run: |
          if [ -f "$REPORT_FILE" ]; then
            python3 .github/scripts/to_sarif.py \
              --report "$REPORT_FILE" \
              --output /tmp/appsec-2shell.sarif \
              --tool "appsec-2shell-detector" \
              --commit-sha "${{ github.sha }}"
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: /tmp/appsec-2shell.sarif
        continue-on-error: true

      - name: Gate on severity threshold
        if: always() && env.GATE_SEVERITY != ''
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "::warning::No Threatlint report was produced; the severity gate was not evaluated."
            exit 0
          fi
          python3 .github/scripts/gate_report.py \
            --report "$REPORT_FILE" \
            --severity "$GATE_SEVERITY" \
            --mode "$GATE_MODE"

      - name: Create GitHub issues for findings
        if: always()
        env:
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file — skipping issue creation."
            exit 0
          fi
          python3 .github/scripts/create_issues.py \
            --report "$REPORT_FILE" \
            --run-url "$REVIEW_RUN_URL" \
            --min-severity "$MIN_ISSUE_SEVERITY"

  fleet:
    name: Detect 2Shell exposure (fleet)
    if: github.event_name == 'workflow_dispatch' && inputs.fleet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FAIL_ON: ${{ inputs.fail-on || 'none' }}
      TARGETS_JSON: ${{ inputs.targets }}
      TARGETS_FILE: /tmp/appsec-2shell-targets.json
      REPORT_FILE: /tmp/appsec-2shell-fleet.md
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Threatlint
        run: python3 -m pip install --quiet .

      # The input is passed through the environment and validated as JSON; it is never
      # interpolated into a shell command.
      - name: Write fleet targets
        run: |
          if [ -z "$TARGETS_JSON" ]; then
            # Default: every repository, default branch, every available credential.
            TARGETS_JSON='{"connections":[{"connection":"*","repositories":"all","branches":"default"}]}'
            export TARGETS_JSON
          fi
          python3 -c 'import json, os, sys; json.loads(os.environ["TARGETS_JSON"]); open(sys.argv[1], "w", encoding="utf-8").write(os.environ["TARGETS_JSON"])' "$TARGETS_FILE"

      - name: Scan fleet
        env:
          GH_TOKEN: ${{ secrets.THREATLINT_FLEET_GITHUB_TOKEN || github.token }}
          THREATLINT_ADO_PAT: ${{ secrets.THREATLINT_FLEET_ADO_PAT }}
          THREATLINT_ADO_ORG: ${{ vars.THREATLINT_FLEET_ADO_ORG }}
        run: |
          args=(fleet --targets-file "$TARGETS_FILE" --format markdown --output "$REPORT_FILE" --progress)
          if [ "$FAIL_ON" != "none" ]; then args+=(--fail-on "$FAIL_ON"); fi
          threatlint detect-2shell "${args[@]}"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fleet reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appsec-2shell-fleet-${{ github.run_id }}
          path: /tmp/appsec-2shell-fleet.md
          retention-days: 30
          if-no-files-found: warn
