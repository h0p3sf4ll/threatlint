name: AppSec API Security Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/**'
      - 'app/**'
      - 'api/**'
      - 'routes/**'
      - 'controllers/**'
      - 'handlers/**'
      - 'graphql/**'
      - '**/*.proto'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write
  id-token: write

concurrency:
  group: appsec-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Model review configuration
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.configuration.outputs.enabled }}
    steps:
      - name: Check out review configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check model review setup
        id: configuration
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPSEC_ENABLED: ${{ vars.APPSEC_REVIEWS_ENABLED }}
          APPSEC_PROVIDER: ${{ vars.APPSEC_PROVIDER }}
          APPSEC_GATE_MODE: ${{ vars.APPSEC_GATE_MODE }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: python3 .github/scripts/appsec_configuration.py

  api-security:
    needs: configuration
    if: >-
      needs.configuration.outputs.enabled == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVIDER: ${{ vars.APPSEC_PROVIDER || 'claude' }}
      MIN_ISSUE_SEVERITY: ${{ vars.APPSEC_MIN_ISSUE_SEVERITY || 'HIGH' }}
      GATE_SEVERITY: ${{ vars.APPSEC_GATE_SEVERITY || 'CRITICAL' }}
      # warn (default): findings are annotated and the job stays green. fail: the job fails.
      GATE_MODE: ${{ vars.APPSEC_GATE_MODE || 'warn' }}
      REPORT_FILE: /tmp/appsec-api-report.md

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ─── Claude ───────────────────────────────────────────────────────────
      - name: Run API security review (Claude)
        if: env.PROVIDER == 'claude'
        uses: anthropics/claude-code-action@9c41ed18ca8b2b2a17eaef4723d5092ccdebc814 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the project appsec-api-security-reviewer to review all API endpoints
            in this repository against the OWASP API Security Top 10 (2023).

            Produce a two-tier Markdown API security review:
            TIER 1: API Security Level, Finding Summary table, Top Issues.
            TIER 2: API Endpoint Inventory table, per-finding blocks ([AR-NNN] — Title,
            OWASP API Category, CWE, Endpoint METHOD /path, File location, Evidence,
            Exploit Path, Impact, Mitigation with corrected code snippet),
            OWASP API Security Coverage Matrix.

            After writing the report, save it:
            tee /tmp/appsec-api-report.md << 'APPSEC_END_OF_REPORT'
            [paste complete report, then close with APPSEC_END_OF_REPORT]
            APPSEC_END_OF_REPORT

            Do not modify any repository source files.
          claude_args: |
            --model ${{ vars.THREATLINT_SCAN_MODEL || 'claude-opus-5-5' }}
            --agent appsec-api-security-reviewer
            --max-turns 16
            --allowedTools "Read,Grep,Glob,Bash"

      # ─── OpenAI / GitHub Models ───────────────────────────────────────────
      - name: Set up Python
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install openai SDK
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        run: pip install openai

      - name: Run API security review (OpenAI / GitHub Models)
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/appsec_api.py \
            --mode api-security \
            --provider "$PROVIDER" \
            --output "$REPORT_FILE"

      # ─── Upload artifact ──────────────────────────────────────────────────
      - name: Upload API security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appsec-api-report-${{ github.run_id }}
          path: ${{ env.REPORT_FILE }}
          retention-days: 30
          if-no-files-found: warn

      # ─── SARIF upload to GitHub Code Scanning ────────────────────────────
      - name: Convert report to SARIF
        if: always()
        run: |
          if [ -f "$REPORT_FILE" ]; then
            python3 .github/scripts/to_sarif.py \
              --report "$REPORT_FILE" \
              --output /tmp/appsec-api.sarif \
              --tool "appsec-api-security-reviewer" \
              --commit-sha "${{ github.sha }}"
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: /tmp/appsec-api.sarif
        continue-on-error: true

      # ─── Gate: warn (default) or fail on findings at or above threshold ─────
      - name: Gate on severity threshold
        if: always() && env.GATE_SEVERITY != ''
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "::warning::No Threatlint report was produced; the severity gate was not evaluated."
            exit 0
          fi
          python3 .github/scripts/gate_report.py \
            --report "$REPORT_FILE" \
            --severity "$GATE_SEVERITY" \
            --mode "$GATE_MODE"

      # ─── Create GitHub issues ─────────────────────────────────────────────
      - name: Create GitHub issues for findings
        if: always()
        env:
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file — skipping issue creation."
            exit 0
          fi
          python3 .github/scripts/create_issues.py \
            --report "$REPORT_FILE" \
            --pr "${{ github.event.pull_request.number }}" \
            --run-url "$REVIEW_RUN_URL" \
            --min-severity "$MIN_ISSUE_SEVERITY"
