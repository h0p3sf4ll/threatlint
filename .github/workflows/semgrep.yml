name: Semgrep security scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep source scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned scanner
        run: python -m pip install --disable-pip-version-check semgrep==1.186.0
      - name: Scan the full source tree
        # The scanner reads the checkout. No repository build or install script is executed.
        run: semgrep scan --config p/ci --error --metrics off --json --output semgrep-results.json
      - name: Save scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-${{ github.sha }}
          path: semgrep-results.json
          if-no-files-found: error
          retention-days: 14
