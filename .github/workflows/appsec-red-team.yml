name: AppSec Red Team

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target component or attack surface (leave blank to auto-select top 5 from repo)'
        required: false
        default: ''
  schedule:
    # Quarterly red team — first Monday of Jan/Apr/Jul/Oct at 08:00 UTC
    - cron: '0 8 1-7 1,4,7,10 1'

permissions:
  contents: read
  issues: write
  security-events: write
  id-token: write

jobs:
  configuration:
    name: Model review configuration
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.configuration.outputs.enabled }}
    steps:
      - name: Check out review configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check model review setup
        id: configuration
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPSEC_ENABLED: ${{ vars.APPSEC_REVIEWS_ENABLED }}
          APPSEC_PROVIDER: ${{ vars.APPSEC_PROVIDER }}
          APPSEC_GATE_MODE: ${{ vars.APPSEC_GATE_MODE }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: python3 .github/scripts/appsec_configuration.py

  red-team:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROVIDER: ${{ vars.APPSEC_PROVIDER || 'claude' }}
      MIN_ISSUE_SEVERITY: ${{ vars.APPSEC_MIN_ISSUE_SEVERITY || 'HIGH' }}
      GATE_SEVERITY: ${{ vars.APPSEC_GATE_SEVERITY || 'CRITICAL' }}
      # warn (default): findings are annotated and the job stays green. fail: the job fails.
      GATE_MODE: ${{ vars.APPSEC_GATE_MODE || 'warn' }}
      REPORT_FILE: /tmp/appsec-red-team-report.md

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ─── Claude ───────────────────────────────────────────────────────────
      - name: Run red team analysis (Claude)
        if: env.PROVIDER == 'claude'
        uses: anthropics/claude-code-action@9c41ed18ca8b2b2a17eaef4723d5092ccdebc814 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the project appsec-red-team to generate 5 adversarial attack scenarios
            against the highest-risk components in this repository.
            Target focus (if specified): ${{ github.event.inputs.target || 'auto-select top 5 attack surfaces' }}

            Produce exactly 5 scenarios, each with:
            - Attacker Persona and Primary Objective
            - Full Kill Chain (Recon → Initial Access → Execution → Persistence →
              Privilege Escalation → Lateral Movement → Exfiltration/Impact)
            - PoC Description (technical detail, not working exploit code)
            - Evidence (file:line citations)
            - Detection Gaps
            - Purple Team Test Cases (3 per scenario)
            End with Cross-Scenario Analysis: common entry points, highest-priority controls,
            detection coverage summary.

            After writing the report, save it:
            tee /tmp/appsec-red-team-report.md << 'APPSEC_END_OF_REPORT'
            [paste complete report, then close with APPSEC_END_OF_REPORT]
            APPSEC_END_OF_REPORT

            Do not modify any repository source files.
          claude_args: |
            --model ${{ vars.THREATLINT_SCAN_MODEL || 'claude-opus-5-5' }}
            --agent appsec-red-team
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash"

      # ─── OpenAI / GitHub Models ───────────────────────────────────────────
      - name: Set up Python
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install openai SDK
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        run: pip install openai

      - name: Run red team analysis (OpenAI / GitHub Models)
        if: env.PROVIDER == 'openai' || env.PROVIDER == 'github-models'
        env:
          REVIEW_TARGET: ${{ github.event.inputs.target }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/appsec_api.py \
            --mode red-team \
            --provider "$PROVIDER" \
            --target "$REVIEW_TARGET" \
            --output "$REPORT_FILE"

      # ─── Upload artifact ──────────────────────────────────────────────────
      - name: Upload red team report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appsec-red-team-report-${{ github.run_id }}
          path: ${{ env.REPORT_FILE }}
          retention-days: 90
          if-no-files-found: warn

      # ─── SARIF upload to GitHub Code Scanning ────────────────────────────
      - name: Convert report to SARIF
        if: always()
        run: |
          if [ -f "$REPORT_FILE" ]; then
            python3 .github/scripts/to_sarif.py \
              --report "$REPORT_FILE" \
              --output /tmp/appsec-red-team.sarif \
              --tool "appsec-red-team" \
              --commit-sha "${{ github.sha }}"
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: /tmp/appsec-red-team.sarif
        continue-on-error: true

      # ─── Gate: warn (default) or fail on findings at or above threshold ─────
      - name: Gate on severity threshold
        if: always() && env.GATE_SEVERITY != ''
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "::warning::No Threatlint report was produced; the severity gate was not evaluated."
            exit 0
          fi
          python3 .github/scripts/gate_report.py \
            --report "$REPORT_FILE" \
            --severity "$GATE_SEVERITY" \
            --mode "$GATE_MODE"

      # ─── Create GitHub issues ─────────────────────────────────────────────
      - name: Create GitHub issues for findings
        if: always()
        env:
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file — skipping issue creation."
            exit 0
          fi
          python3 .github/scripts/create_issues.py \
            --report "$REPORT_FILE" \
            --run-url "$REVIEW_RUN_URL" \
            --min-severity "$MIN_ISSUE_SEVERITY"
