name: Desktop app build

# Every change to the shared workbench code rebuilds the Electron app from the same sources
# the browser runner uses, so the desktop download never lags the web version.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/threatlint/data/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'src/threatlint/data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Package (unsigned)
        working-directory: web
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:pack
      - name: Verify package matches source
        working-directory: web
        run: npm run desktop:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threatlint-desktop-${{ matrix.os }}
          path: |
            web/release/*/
            !web/release/**/*.blockmap
          retention-days: 14
