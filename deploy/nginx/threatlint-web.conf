# Include this file from nginx's http context (for example sites-enabled on Ubuntu).
map $http_upgrade $threatlint_connection {
    default upgrade;
    '' close;
}

# Log paths without callback query strings, which can contain OAuth transaction data.
log_format threatlint_web '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name app.threatlint.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://app.threatlint.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.threatlint.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/app.threatlint.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.threatlint.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/threatlint-web.access.log threatlint_web;

    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $threatlint_connection;
        proxy_set_header Proxy "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
