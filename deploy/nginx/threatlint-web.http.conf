# Initial HTTP-only configuration for obtaining the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name app.threatlint.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
