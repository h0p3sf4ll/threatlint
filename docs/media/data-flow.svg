<svg width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="dfdT dfdD" xmlns="http://www.w3.org/2000/svg">
<title id="dfdT">Threatlint data flow diagram</title>
<desc id="dfdD">Requests are routed to a specialist that loads skills, inspects source through read-only tools, sends prompts to a model, and composes a report. Delivery to external systems is a separate approval-gated process. Red dashed lines are trust boundaries.</desc><style>svg { --fg:#1A2230; --muted:#5B6779; --line:#D4DCE7; --accent:#0F6CBD; --accent-soft:#E7F1FB;
  --zone:#EEF3F9; --core:#E9F2FC; --warn:#B85A00; --warn-soft:#FFF5E8; --danger:#C4314B; --surface:#FFFFFF; --bg:#F5F7FA; --on-accent:#FFFFFF;
  --sans:"Segoe UI","Source Sans 3",system-ui,-apple-system,sans-serif; --mono:"Cascadia Code",Consolas,ui-monospace,monospace; }
@media (prefers-color-scheme: dark) { svg { --fg:#E5EBF2; --muted:#98A6B8; --line:#2A3544; --accent:#5AAEF5; --accent-soft:#13283E;
  --zone:#121922; --core:#12233A; --warn:#F3A64D; --warn-soft:#2A1E0F; --danger:#F27D90; --surface:#151C26; --bg:#0E131A; --on-accent:#0E131A; } }
.bgr { fill: var(--bg); }
/* SVG styles */
.zone { fill: var(--zone); stroke: var(--line); stroke-width: 1.2; }
.zone.core { fill: var(--core); stroke: var(--accent); stroke-opacity: .45; }
.zone.write { fill: var(--warn-soft); stroke: var(--warn); stroke-dasharray: 7 5; stroke-width: 1.5; }
.zt { font: 600 12.5px var(--sans); fill: var(--muted); letter-spacing: .02em; }
.lbl { font: 600 12.5px var(--sans); fill: var(--fg); }
.sub { font: 11px var(--sans); fill: var(--muted); }
.fl { font: 600 11px var(--sans); fill: var(--muted); paint-order: stroke; stroke: var(--zone); stroke-width: 4px; }
.note { font: italic 11.5px var(--sans); fill: var(--warn); }
.flow { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.flow.warn { stroke: var(--warn); stroke-width: 1.8; }
.flow.untrusted { stroke: var(--danger); stroke-dasharray: 6 4; }
.bus { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .7; }
.arrowhead { fill: var(--muted); } .arrowhead-w { fill: var(--warn); }
.tb { fill: none; stroke: var(--danger); stroke-width: 1.6; stroke-dasharray: 8 6; }
.tbt { font: 600 12px var(--sans); fill: var(--danger); }
.ent { fill: var(--surface); stroke: var(--fg); stroke-width: 1.4; }
.proc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
.pn { font: 700 11px var(--mono); fill: var(--accent); }
.store { fill: none; stroke: var(--fg); stroke-width: 1.4; }
.badge { fill: var(--accent); }
.bn { font: 700 10.5px var(--sans); fill: var(--on-accent); }

</style><defs>
