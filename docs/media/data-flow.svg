<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
<title id="title">Threatlint Workbench data flow and trust boundaries</title><desc id="desc">A user selects a repository, scope, specialists and evidence. The local Workbench assembles contracts, uses restricted source inspection and a selected model, and saves advisory reports. Separate authorized workflows may transmit results or modify external services. Red dashed outlines mark host and remote-provider boundaries.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#456475"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9b6017"/></marker></defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#163542}.title{font-size:30px;font-weight:700;letter-spacing:-.5px}.sub{font-size:17px;fill:#486472}.head{font-size:19px;font-weight:700}.body{font-size:16px;fill:#355662}.small{font-size:14px;fill:#486472}.tag{font-size:13px;font-weight:700;letter-spacing:1px;fill:#087967}.line{fill:none;stroke:#456475;stroke-width:2;marker-end:url(#arrow)}.write{fill:none;stroke:#9b6017;stroke-width:2;marker-end:url(#amber)}.edge{font-size:14px;fill:#355662;paint-order:stroke;stroke:#f7fafb;stroke-width:6px;stroke-linejoin:round}.boundary{fill:#fff;stroke:#c95353;stroke-width:1.5;stroke-dasharray:8 6}</style>
<rect width="1440" height="1110" rx="18" fill="#f7fafb"/>
<text x="40" y="55" class="title">Workbench review: evidence flow is not authority flow</text>
<text x="40" y="86" class="sub">Example path · browser and Electron share this backend · Python, native clients, and CI differ</text>
<rect x="418" y="116" width="610" height="111" rx="12" fill="#e9f7f3" stroke="#71b5a7" stroke-width="1.5"/>
<text x="438" y="145" class="head">User-directed review</text>
<text x="438" y="170" class="body">1 · Select repository, scope, specialists, and optional supporting evidence</text>
<rect x="36" y="267" width="1032" height="785" rx="16" class="boundary"/>
<text x="58" y="297" class="tag">LOCAL HOST · single-user Workbench · isolate untrusted repositories</text>
<rect x="64" y="338" width="302" height="145" rx="12" fill="#ffffff" stroke="#c5d5dc" stroke-width="1.5"/>
<text x="84" y="367" class="head">Canonical contracts</text>
<text x="84" y="392" class="body">2 · Agent definition</text>
<text x="84" y="417" class="body">Required shared + domain skills</text>
<text x="84" y="442" class="body">Not an authorization mechanism</text>
<rect x="418" y="338" width="610" height="145" rx="12" fill="#e9f7f3" stroke="#71b5a7" stroke-width="1.5"/>
<text x="438" y="367" class="head">Review runner + selected specialists</text>
<text x="438" y="392" class="body">4 · Bounded findings/design context; claims remain untrusted</text>
<text x="438" y="417" class="body">5 · Send context to selected model; host validates tool requests</text>
<text x="438" y="442" class="body">Dependency-aware orchestration, not a universal truth checker</text>
<path d="M721 227V333" class="line"/>
<path d="M366 410H413" class="line"/>
<rect x="64" y="556" width="302" height="178" rx="12" fill="#ffffff" stroke="#c5d5dc" stroke-width="1.5"/>
<text x="84" y="585" class="head">Selected source + evidence</text>
<text x="84" y="610" class="body">3 · Checkout + revision metadata</text>
<text x="84" y="635" class="body">Source / diffs / history</text>
<text x="84" y="660" class="body">Findings / design documents</text>
<text x="84" y="685" class="body">Runtime capture provenance</text>
<rect x="418" y="556" width="284" height="178" rx="12" fill="#eef4fc" stroke="#8cadcf" stroke-width="1.5"/>
<text x="438" y="585" class="head">Inspection boundary</text>
<text x="438" y="610" class="body">6 · Read / Grep / Glob</text>
<text x="438" y="635" class="body">Allowlisted commands</text>
<text x="438" y="660" class="body">Repo path confinement</text>
<text x="438" y="685" class="body">Not an OS sandbox</text>
<rect x="746" y="556" width="282" height="178" rx="12" fill="#eef4fc" stroke="#8cadcf" stroke-width="1.5"/>
<text x="766" y="585" class="head">Advisory output</text>
<text x="766" y="610" class="body">7 · Final report</text>
<text x="766" y="635" class="body">Parsed findings + warnings</text>
<text x="766" y="660" class="body">Proposals NOT APPLIED</text>
<text x="766" y="685" class="body">Tests NOT RUN by default</text>
<path d="M366 638H413" class="line"/>
<text x="390" y="620" class="edge" text-anchor="middle">source</text>
<path d="M558 556V488" class="line"/>
<text x="558" y="530" class="edge" text-anchor="middle">tools + results</text>
<path d="M886 483V551" class="line"/>
<text x="886" y="530" class="edge" text-anchor="middle">report</text>
<path d="M216 556V518H446V488" class="line"/>
<text x="289" y="512" class="edge" text-anchor="middle">supplied documents / findings</text>
<rect x="418" y="817" width="284" height="146" rx="12" fill="#ffffff" stroke="#c5d5dc" stroke-width="1.5"/>
<text x="438" y="846" class="head">Local report store</text>
<text x="438" y="871" class="body">8 · Markdown + optional Word</text>
<text x="438" y="896" class="body">May contain source/sensitive data</text>
<text x="438" y="921" class="body">Review before sharing</text>
<rect x="746" y="817" width="282" height="146" rx="12" fill="#fff5e4" stroke="#d9b06b" stroke-width="1.5"/>
<text x="766" y="846" class="head">Authorized operations</text>
<text x="766" y="871" class="body">9 · Target + action scope</text>
<text x="766" y="896" class="body">Posting / closure / publication</text>
<text x="766" y="921" class="body">Separate from review agents</text>
<path d="M886 734V775H558V812" class="line"/>
<path d="M702 887H741" class="write"/>

<rect x="1110" y="267" width="294" height="350" rx="16" class="boundary"/>
<text x="1128" y="297" class="tag">REMOTE MODEL BOUNDARY</text>
<rect x="1130" y="338" width="254" height="195" rx="12" fill="#eef4fc" stroke="#8cadcf" stroke-width="1.5"/>
<text x="1150" y="367" class="head">Selected provider</text>
<text x="1150" y="392" class="body">5 · Prompt + evidence</text>
<text x="1150" y="417" class="body">Tool results + model output</text>
<text x="1150" y="442" class="body">Cloud / remote compatible</text>
<text x="1150" y="467" class="body">Local model can stay on host</text>
<path d="M1028 410H1125" class="line"/>
<path d="M1130 451H1033" class="line"/>
<text x="1130" y="573" class="small">Workbench remote consent applies.</text>
<text x="1130" y="595" class="small">No blanket redaction guarantee.</text>
<rect x="1110" y="775" width="294" height="277" rx="16" class="boundary"/>
<text x="1128" y="805" class="tag">EXTERNAL SYSTEMS</text>
<rect x="1130" y="841" width="254" height="136" rx="12" fill="#fff5e4" stroke="#d9b06b" stroke-width="1.5"/>
<text x="1150" y="870" class="head">Systems of record</text>
<text x="1150" y="895" class="body">PRs / trackers / rules</text>
<text x="1150" y="920" class="body">Authorized write workflow</text>
<text x="1150" y="945" class="body">No authority from model text</text>
<path d="M1028 887H1125" class="write"/>
<text x="58" y="1016" class="small">Dashed red outlines: trust boundaries. Arrows: data flow. Numbers match the architecture guide.</text>
<text x="40" y="1086" class="small">Read-only inspection can still transmit information. Check provider, recipients, sensitive data, and the scope of any operational action.</text>
</svg>
