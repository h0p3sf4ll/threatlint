<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">Threatlint: shared contracts, separate runtimes</title><desc id="desc">The package shares specialist protocols and skills across separate clients. Native clients, Python CLI, Node Workbench, and CI or Teams have distinct runtime boundaries. Local evidence and selected models feed advisory outputs; operational writes use separate authorization.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#456475"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9b6017"/></marker></defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#163542}.title{font-size:30px;font-weight:700;letter-spacing:-.5px}.sub{font-size:17px;fill:#486472}.head{font-size:19px;font-weight:700}.body{font-size:16px;fill:#355662}.small{font-size:14px;fill:#486472}.tag{font-size:13px;font-weight:700;letter-spacing:1px;fill:#087967}.line{fill:none;stroke:#456475;stroke-width:2;marker-end:url(#arrow)}.write{fill:none;stroke:#9b6017;stroke-width:2;marker-end:url(#amber)}.edge{font-size:14px;fill:#355662;paint-order:stroke;stroke:#f7fafb;stroke-width:6px;stroke-linejoin:round}.boundary{fill:#fff;stroke:#c95353;stroke-width:1.5;stroke-dasharray:8 6}</style>
<rect width="1440" height="1050" rx="18" fill="#f7fafb"/>
<text x="48" y="56" class="title">Shared contracts. Separate runtimes. Explicit authority.</text>
<text x="48" y="87" class="sub">Component map · implementation-oriented · model and native-client behavior depend on configuration</text>
<rect x="48" y="123" width="1344" height="125" rx="12" fill="#e9f7f3" stroke="#71b5a7" stroke-width="1.5"/>
<text x="68" y="152" class="head">Canonical review material</text>
<text x="68" y="177" class="body">22 specialist protocols + 26 skills + agent-skills.json + agent-contracts.json</text>
<text x="68" y="202" class="body">Installers and prompt assembly share contracts; CI and conversation adapters also use purpose-specific prompt packs.</text>
<path d="M198 248V295" class="line"/>
<path d="M546 248V295" class="line"/>
<path d="M894 248V295" class="line"/>
<path d="M1242 248V295" class="line"/>
<rect x="48" y="298" width="300" height="216" rx="12" fill="#ffffff" stroke="#c5d5dc" stroke-width="1.5"/>
<text x="68" y="327" class="tag">CLIENT RUNTIME</text>
<text x="68" y="354" class="head">Native coding clients</text>
<text x="68" y="379" class="body">Claude / Copilot / Codex</text>
<text x="68" y="404" class="body">Installed agents + skills</text>
<text x="68" y="429" class="body">Client-owned tool loop</text>
<text x="68" y="454" class="body">Client permissions apply</text>
<rect x="396" y="298" width="300" height="216" rx="12" fill="#ffffff" stroke="#c5d5dc" stroke-width="1.5"/>
<text x="416" y="327" class="tag">PYTHON RUNTIME</text>
<text x="416" y="354" class="head">Python CLI</text>
<text x="416" y="379" class="body">cli.py + run_context.py</text>
<text x="416" y="404" class="body">Provider-specific API loops</text>
<text x="416" y="429" class="body">agent_tools.py or CLI adapter</text>
<text x="416" y="454" class="body">report_output.py</text>
<rect x="744" y="298" width="300" height="216" rx="12" fill="#ffffff" stroke="#c5d5dc" stroke-width="1.5"/>
<text x="764" y="327" class="tag">NODE RUNTIME</text>
<text x="764" y="354" class="head">Workbench</text>
<text x="764" y="379" class="body">Browser + Electron UI</text>
<text x="764" y="404" class="body">Same local Node backend</text>
<text x="764" y="429" class="body">pipeline.cjs + providers.cjs</text>
<text x="764" y="454" class="body">tools.cjs + report-writer.cjs</text>
<rect x="1092" y="298" width="300" height="216" rx="12" fill="#ffffff" stroke="#c5d5dc" stroke-width="1.5"/>
<text x="1112" y="327" class="tag">HOSTED WORKFLOWS</text>
<text x="1112" y="354" class="head">CI and conversations</text>
<text x="1112" y="379" class="body">GitHub / Azure / Teams</text>
<text x="1112" y="404" class="body">Snapshot or supplied evidence</text>
<text x="1112" y="429" class="body">Workflow-specific permissions</text>
<text x="1112" y="454" class="body">Not the Workbench process</text>
<rect x="48" y="552" width="1344" height="118" rx="12" fill="#edf2f5"/>
<text x="72" y="581" class="tag">EVIDENCE + PROVIDER BOUNDARIES</text>
<text x="72" y="611" class="body">Repository source, diffs, scanner artifacts, supplied design documents, and runtime captures are untrusted evidence.</text>
<text x="72" y="641" class="body">Selected local or cloud providers receive the context each runner sends. A shared prompt is not a shared sandbox.</text>
<path d="M198 514V548" class="line"/>
<path d="M546 514V548" class="line"/>
<path d="M894 514V548" class="line"/>
<path d="M1242 514V548" class="line"/>
<path d="M420 670V719" class="line"/>
<path d="M1068 670V719" class="line"/>
<rect x="48" y="722" width="744" height="156" rx="12" fill="#e9f7f3" stroke="#71b5a7" stroke-width="1.5"/>
<text x="68" y="751" class="head">Advisory analysis and report persistence</text>
<text x="68" y="776" class="body">Findings + assumptions + proposed changes + validation status</text>
<text x="68" y="801" class="body">Format checks are not a factual verifier. Output locations vary by host.</text>
<text x="68" y="826" class="body">Source analysis is read-only; host-owned report persistence can write files.</text>
<rect x="824" y="722" width="568" height="156" rx="12" fill="#fff5e4" stroke="#d9b06b" stroke-width="1.5"/>
<text x="844" y="751" class="head">Separate operational workflows</text>
<text x="844" y="776" class="body">Tracker closure · rule publishing · PR comments · runtime</text>
<text x="844" y="801" class="body">Require authorized targets/actions and workflow-specific controls.</text>
<text x="844" y="826" class="body">A finding or downstream agent cannot grant that authority.</text>
<text x="48" y="930" class="tag">SOURCE MAP</text>
<text x="48" y="961" class="body">Contracts: src/threatlint/data/  ·  Python: src/threatlint/  ·  Workbench: web/lib/  ·  CI: .github/scripts/</text>
<text x="48" y="993" class="small">Offline guard: a separate deterministic scanner, with no model call. See docs/architecture.md for source links and limits.</text>
</svg>
