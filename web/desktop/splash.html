<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Threatlint</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101617; color: #e6eeee; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-app-region: drag; user-select: none; }
    main { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 0 28px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
    .bar { width: 220px; height: 3px; border-radius: 2px; background: #1f2b2d; overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #3fb8a5; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #title { font-weight: 500; }
    #detail { color: #8aa0a2; font: 11px/1.4 ui-monospace, Menlo, monospace; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <h1>Threatlint</h1>
    <div class="bar"></div>
    <div id="title">Starting…</div>
    <div id="detail"></div>
  </main>
</body>
</html>
